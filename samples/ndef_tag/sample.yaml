sample:
  name: NDEF tag image
  description: Build a Type 2 Tag data area holding a Smart Poster and read it back
common:
  tags:
    - nfc
    - ndef
  integration_platforms:
    - qemu_x86
  harness: console
  harness_config:
    type: multi_line
    ordered: true
    regex:
      - "tag area: \\d+ octets"
      - "URI: https://zephyrproject.org"
      - "title \\[en\\]: Zephyr Project"
      - "title \\[fr\\]: Projet Zephyr"
      - "done"
tests:
  sample.zndef.ndef_tag:
    platform_allow:
      - qemu_x86
      - qemu_cortex_m3
  sample.zndef.ndef_tag.minimal:
    build_only: true
    platform_allow:
      - qemu_x86
      - qemu_cortex_m3
    extra_configs:
      - CONFIG_ZNDEF_RTD_SIG=n
      - CONFIG_ZNDEF_RTD_HANDOVER=n
      - CONFIG_ZNDEF_RTD_DI=n
      - CONFIG_ZNDEF_VALIDATE_RTD=n
